name: Publish verified official QuangNV 26.11.23.1 V7-only Word OTA

on:
  push:
    paths:
      - 'ota-releases/v26.11.23.1/READY_TO_PUBLISH.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified staged material
        uses: actions/checkout@v4

      - name: Install zstd if required
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi

      - name: Download original public 26.11.23 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v26.11.23 --pattern 'ChuanHoa_VanBanDang_26.11.23.dotm' --clobber
          echo "04963ad3d01aed1c771febc034d48c8d307d38d07b481839d1a5594193d3e1a8  ChuanHoa_VanBanDang_26.11.23.dotm" | sha256sum -c -

      - name: Reconstruct 26.11.23.1 from approved signed binary delta
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ota-releases/v26.11.23.1/delta_b64.txt > payload_delta.zst
          zstd --patch-from=ChuanHoa_VanBanDang_26.11.23.dotm -q -d -f payload_delta.zst -o ChuanHoa_VanBanDang_26.11.23.1.dotm

      - name: Verify official RSA signature, Word VBA, Ribbon, and original AI helper
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,importlib.util,json,zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          m=json.loads(Path('ota-releases/v26.11.23.1/manifest_OTA_DA_KY.json').read_text(encoding='utf-8-sig'))
          p=Path('ChuanHoa_VanBanDang_26.11.23.1.dotm')
          original=Path('ChuanHoa_VanBanDang_26.11.23.dotm')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expect='https://github.com/quanglci/QuangNV-Word-Addin/releases/download/v26.11.23.1/'+p.name
          for k,v in {'version':'26.11.23.1','tag':'v26.11.23.1','filename':p.name,
                      'url':expect,'sha256':digest,'file_size_bytes':p.stat().st_size,
                      'signature_algorithm':'RSASSA-PKCS1-v1_5 with SHA-256',
                      'release_scope':'production'}.items():
            assert m.get(k)==v, 'Manifest mismatch: '+k
          spec=importlib.util.spec_from_file_location('official','tools/verify_ota_2026_11_21_10.py')
          official=importlib.util.module_from_spec(spec);spec.loader.exec_module(official)
          sig=base64.b64decode(m['signature'],validate=True)
          assert official.verify_signature((m['version']+'\n'+digest+'\n'+expect).encode(),sig), 'OFFICIAL RSA SIGNATURE INVALID'
          with zipfile.ZipFile(original) as old,zipfile.ZipFile(p) as new:
            a=set(old.namelist());b=set(new.namelist())
            assert a==b and len(b)==41, 'Word parts lost or added'
            assert new.testzip() is None
            assert old.read('word/vbaProject.bin') != new.read('word/vbaProject.bin'), 'No VBA fix found'
            vba=new.read('word/vbaProject.bin')
            for x in (b'RibbonCauHinhAI',b'TT_QNV_V7_RepositionAgencyLine',b'TT_QNV_V6_ExpandAgencyLeft'):
              assert x in vba, 'Missing expected VBA marker: '+str(x)
            for x in b:
              if x.startswith('customUI/images/') or x.startswith('word/theme/'):
                assert old.read(x)==new.read(x),'Media changed: '+x
            for x in ('customUI/customUI.xml','customUI/customUI14.xml'):
              b=new.read(x)
              assert b.count(b'26.11.23.1')==1 and b'grpQuangNV_Update' in b
              ET.fromstring(b)
          assert b'QNV_231_EnsureAIConfig' not in vba, 'Unexpected AI self-extraction / bootstrap payload'
          print('PASS: official RSA key, SHA256, 41 Word parts, preserved media, Fix V7, no embedded AI helper')
          PY

      - name: Refuse to overwrite an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v26.11.23.1 >/dev/null 2>&1; then
            echo 'Release v26.11.23.1 already exists; will not overwrite.' >&2
            exit 1
          fi

      - name: Publish verified GitHub public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v26.11.23.1 \
            ChuanHoa_VanBanDang_26.11.23.1.dotm \
            ota-releases/v26.11.23.1/manifest_OTA_DA_KY.json \
            --title 'QuangNV 26.11.23.1 - signed V7 formatting ONLY' \
            --notes 'Signed Word OTA based on confirmed V7. Preserves 14pt agency font, column expansion, all underline shapes and existing AI / Ribbon / OTA. No embedded AI script or VBA self-extraction. Standalone AI config app is distributed separately. Validate on one Windows PC before rollout. No production feed activation by this workflow.'

      - name: Verify downloaded GitHub asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('ChuanHoa_VanBanDang_26.11.23.1.dotm')
          release=json.loads(subprocess.check_output(['gh','api','repos/quanglci/QuangNV-Word-Addin/releases/tags/v26.11.23.1'],text=True))
          asset=next(x for x in release['assets'] if x['name']==p.name)
          assert asset['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          assert not release['draft'] and not release['prerelease']
          print('PASS: publicly published GitHub asset SHA-256 verified.')
          PY
